name: Build Windows release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build with PyInstaller
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --noconfirm --clean --onedir --name AION2CraftPlanner --add-data "calculator.html;." local_planner.py

      - name: Zip the program folder
        shell: pwsh
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          $label = if ($env:TAG) { $env:TAG } else { "test" }
          $zip = "AION2CraftPlanner-$label.zip"
          Compress-Archive -Path "dist/AION2CraftPlanner" -DestinationPath $zip
          "ZIP_NAME=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Keep the zip as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AION2CraftPlanner
          path: ${{ env.ZIP_NAME }}

      - name: Attach the zip to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: ${{ env.ZIP_NAME }}
          fail_on_unmatched_files: true
